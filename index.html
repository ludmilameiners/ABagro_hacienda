<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AB Agro &middot; Feedlot</title>
<style>
  :root{
    --paper:#EBEDE4; --card:#FCFCFA; --ink:#23281E; --muted:#6B7263;
    --line:rgba(35,40,30,0.10); --accent:#3B6E4F; --accent-d:#2C5540; --err:#B23B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink); background:var(--paper);
    min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  #gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:34px 28px; width:100%; max-width:390px; text-align:center;
    box-shadow:0 1px 2px rgba(35,40,30,.04), 0 14px 34px rgba(35,40,30,.08);
  }
  .lock{ width:48px; height:48px; margin:0 auto 16px; color:var(--accent); display:block; }
  h1{ font-size:1.3rem; margin:0 0 4px; letter-spacing:-.01em; }
  .sub{ color:var(--muted); font-size:.92rem; margin:0 0 22px; }
  .field{ text-align:left; }
  label{ display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 6px; }
  #pw{
    width:100%; font-size:1rem; padding:13px 14px; border-radius:10px;
    border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  #pw:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .row{ display:flex; align-items:center; gap:8px; margin-top:10px; font-size:.85rem; color:var(--muted); }
  .row input{ width:16px; height:16px; accent-color:var(--accent); }
  .go{
    width:100%; margin-top:16px; font-size:1rem; font-weight:600; color:#fff;
    background:var(--accent); border:0; border-radius:10px; padding:14px; cursor:pointer;
    transition:background .15s ease;
  }
  .go:hover{ background:var(--accent-d); }
  .go:disabled{ opacity:.6; cursor:default; }
  .go:focus-visible{ outline:2px solid var(--accent-d); outline-offset:2px; }
  #err{ color:var(--err); font-size:.88rem; min-height:1.2em; margin-top:12px; }
  .hint{ margin-top:20px; font-size:.74rem; color:var(--muted); line-height:1.45; }
  @media (prefers-reduced-motion: reduce){ .go{ transition:none; } }
</style>
</head>

  <div id="gate">
    <form class="card" id="loginForm" autocomplete="off">
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        <circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"></circle>
      </svg>
      <h1>Feedlot AB Agro</h1>
      <p class="sub">Ingres&aacute; la clave para ver el tablero.</p>
      <div class="field">
        <label for="pw">Clave de acceso</label>
        <input type="password" id="pw" autocomplete="current-password" autofocus />
      </div>
      <label class="row"><input type="checkbox" id="show"> Mostrar la clave</label>
      <button class="go" type="submit" id="goBtn">Entrar</button>
      <div id="err" role="alert"></div>
      <div class="hint">Acceso privado de AB Agro. Sin la clave, esta p&aacute;gina no muestra ning&uacute;n dato: el contenido viaja encriptado.</div>
    </form>
  </div>

  function b64d(s){
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return arr;
  }
  async function decrypt(password){
    var enc = new TextEncoder();
    var mat = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
      mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(PAYLOAD.iv)}, key, b64d(PAYLOAD.ct));
    return new TextDecoder('utf-8').decode(buf);
  }

  var form = document.getElementById('loginForm');
  var err  = document.getElementById('err');
  var btn  = document.getElementById('goBtn');
  var pw   = document.getElementById('pw');
  document.getElementById('show').addEventListener('change', function(e){
    pw.type = e.target.checked ? 'text' : 'password';
  });
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent = '';
    if(!pw.value){ err.textContent = 'Escribí la clave.'; return; }
    btn.disabled = true; btn.textContent = 'Abriendo…';
    try{
      var html = await decrypt(pw.value);
      document.open();
      document.write(html);
      document.close();
    }catch(ex){
      err.textContent = 'Clave incorrecta. Probá de nuevo.';
      btn.disabled = false; btn.textContent = 'Entrar';
      pw.value=''; pw.focus();
    }
  });
</script>
